<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diario</title>
  <meta name="theme-color" content="#f6f1e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Diario">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Diario</h1>
      <p class="date" id="today"></p>
    </div>
    <div class="streak" id="streak" title="Días seguidos"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="write" role="tab">Escribir</button>
    <button class="tab" data-view="history" role="tab">Historial</button>
    <button class="tab" data-view="settings" role="tab">Ajustes</button>
  </nav>

  <main>
    <!-- WRITE -->
    <section id="view-write" class="view active">
      <div id="stepper" class="stepper"></div>
      <div id="composer">
        <textarea id="entry" placeholder="Hoy…" spellcheck="false" autocorrect="off" autocapitalize="sentences"></textarea>
        <div class="composer-bar">
          <span class="muted" id="wordcount">0 palabras</span>
          <button class="primary" id="btn-correct">Corregir</button>
        </div>
      </div>
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Leyendo tu diario…</p>
      </div>
      <div id="error" class="error hidden"></div>
      <div id="result"></div>
    </section>

    <!-- HISTORY -->
    <section id="view-history" class="view">
      <div id="history-list"></div>
    </section>

    <!-- SETTINGS -->
    <section id="view-settings" class="view">
      <div class="panel">
        <label class="field">
          <span>Código de acceso</span>
          <input id="set-passcode" type="password" autocomplete="off" placeholder="el APP_PASSCODE de Vercel">
        </label>
        <label class="field">
          <span>Mazo de Anki</span>
          <input id="set-deck" type="text" placeholder="Español">
          <small>Usa exactamente el nombre de tu mazo (p. ej. <code>Español</code> o <code>Español::Diario</code>). Las tarjetas se añaden ahí.</small>
        </label>
        <div class="row2">
          <label class="field">
            <span>Tarjetas por día</span>
            <select id="set-ncards">
              <option>3</option><option>4</option><option>5</option><option>6</option>
              <option>7</option><option>8</option><option>10</option>
            </select>
          </label>
          <label class="field">
            <span>Nivel</span>
            <select id="set-level">
              <option>A2</option><option>B1</option><option>B2</option><option>C1</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>Idioma de las explicaciones</span>
          <select id="set-lang">
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
          </select>
        </label>
        <button class="primary" id="btn-save-settings">Guardar</button>
        <span class="muted" id="settings-saved"></span>
      </div>

      <div class="panel">
        <h3>Copia de seguridad</h3>
        <p class="muted">Tu diario vive en este iPad. Descarga una copia de vez en cuando.</p>
        <div class="btnrow">
          <button id="btn-export">Descargar copia</button>
          <label class="button">Restaurar copia<input id="file-import" type="file" accept="application/json" hidden></label>
        </div>
        <p class="muted" id="known-count"></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <script src="apkg.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
